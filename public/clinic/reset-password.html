<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>استعادة كلمة المرور · Clinic OS</title><link rel="stylesheet" href="/owner.css"><script src="config.js" defer></script><script src="supabase-client.js" defer></script><script src="recovery.js" defer></script></head>
<body><main class="owner-shell" style="max-width:540px;margin:7vh auto;padding:20px"><section class="panel"><span>CLINIC OS</span><h1>تعيين كلمة مرور جديدة</h1><p id="reset-message" role="status">جارٍ التحقق من رابط الاستعادة…</p>
<form id="reset-form" class="email-form" hidden><label>كلمة المرور الجديدة<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>تأكيد كلمة المرور<input name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="button primary" type="submit">حفظ كلمة المرور</button></form>
<form id="request-form" class="email-form" hidden><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" required></label><button class="button primary" type="submit">إرسال رابط جديد</button></form><p><a id="login-link" class="button outline" href="index.html?portal=doctor">العودة إلى تسجيل دخول الدكتور</a></p></section></main></body></html>
